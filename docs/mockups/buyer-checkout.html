<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JAPDA 체크아웃</title>
    <style>
      :root {
        --obsidian: #111111;
        --paper-white: #ffffff;
        --concrete-gray: #e5e5e5;
        --soft-mist: #f5f5f5;
        --steel: #707072;
        --faint-gray: #9e9ea0;
        --font: Pretendard, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      html { color-scheme: light; }
      body {
        min-width: 320px;
        margin: 0;
        color: var(--obsidian);
        background: var(--paper-white);
        font: 14px/1.6 var(--font);
        -webkit-font-smoothing: antialiased;
      }
      button, input, textarea { font: inherit; }
      button { cursor: pointer; }
      a { color: inherit; text-decoration: none; }
      a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
        outline: 2px solid var(--obsidian);
        outline-offset: 3px;
      }
      [hidden] { display: none !important; }

      .topbar { height: 72px; border-bottom: 1px solid var(--concrete-gray); }
      .topbar-inner {
        width: min(100% - 64px, 1440px);
        height: 100%;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand { font-size: 20px; font-weight: 600; letter-spacing: -0.04em; }
      .login-button, .primary-button {
        min-height: 42px;
        padding: 0 22px;
        border: 1px solid var(--obsidian);
        border-radius: 30px;
        color: var(--paper-white);
        background: var(--obsidian);
        font-weight: 500;
      }
      .login-button { min-width: 92px; }
      .primary-button:hover, .login-button:hover { opacity: 0.8; }
      .secondary-button {
        min-height: 42px;
        padding: 0 22px;
        border: 1px solid var(--concrete-gray);
        border-radius: 30px;
        background: var(--paper-white);
        font-weight: 500;
      }
      .secondary-button:hover { border-color: var(--obsidian); }

      .page { width: min(100% - 64px, 1200px); margin: auto; padding: 32px 0 120px; }
      .back-link {
        width: fit-content;
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 42px;
        color: var(--steel);
        font-size: 13px;
        font-weight: 500;
      }
      .back-link:hover { color: var(--obsidian); }
      .back-link svg { flex: 0 0 auto; }
      .eyebrow { margin: 0 0 7px; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; }
      h1 { margin: 0; font-size: clamp(34px, 4vw, 48px); font-weight: 600; letter-spacing: -0.055em; line-height: 1.2; }
      .checkout-grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: clamp(48px, 6vw, 96px); margin-top: 54px; align-items: start; }
      .section + .section { margin-top: 64px; }
      .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 17px; border-bottom: 1px solid var(--obsidian); }
      h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.025em; }
      .address-add-button { padding: 0; border: 0; color: var(--steel); background: none; font-size: 13px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
      .address-add-button:hover { color: var(--obsidian); }

      .product { display: flex; gap: 24px; padding: 26px 0; border-bottom: 1px solid var(--concrete-gray); }
      .product-image-wrap { width: 188px; aspect-ratio: 1; flex: 0 0 auto; background: var(--soft-mist); }
      .product-image { width: 100%; height: 100%; display: block; object-fit: cover; }
      .product-image-fallback { width: 100%; height: 100%; display: grid; place-items: center; color: var(--faint-gray); font-size: 12px; }
      .product-info { min-width: 0; flex: 1; display: flex; flex-direction: column; }
      .product-kicker { margin: 1px 0 8px; color: var(--steel); font-size: 11px; font-weight: 600; letter-spacing: 0.13em; }
      .product-name { margin: 0; font-size: 21px; font-weight: 600; line-height: 1.4; letter-spacing: -0.025em; word-break: keep-all; }
      .product-price { margin: 8px 0 0; font-size: 16px; font-weight: 500; }
      .product-quantity { display: flex; justify-content: space-between; gap: 16px; margin-top: auto; color: var(--steel); font-size: 13px; }
      .product-quantity strong { color: var(--obsidian); font-size: 14px; font-weight: 600; }

      .address-list { margin: 0; padding: 0; list-style: none; }
      .address-list li + li { margin-top: 12px; }
      .address-card { position: relative; display: block; padding: 22px 20px; border: 1px solid var(--concrete-gray); cursor: pointer; }
      .address-card:hover { background: #fafafa; }
      .address-card:has(input:checked) { border-color: var(--obsidian); outline: 1px solid var(--obsidian); outline-offset: -1px; background: var(--paper-white); }
      .address-card-head { display: flex; align-items: center; gap: 11px; margin-bottom: 13px; }
      .address-card input { width: 18px; height: 18px; margin: 0; accent-color: var(--obsidian); }
      .address-name { font-size: 16px; font-weight: 600; }
      .address-detail { padding-left: 29px; color: #353535; font-size: 14px; line-height: 1.7; }
      .address-detail span { display: block; }
      .address-detail .recipient { margin-bottom: 3px; font-weight: 500; }
      .address-detail .message { margin-top: 7px; color: var(--steel); font-size: 13px; }

      .empty-address { padding: 58px 20px 62px; border-bottom: 1px solid var(--concrete-gray); text-align: center; }
      .empty-address p { margin: 0 0 22px; color: var(--steel); font-size: 15px; }
      .registration-form { padding-top: 26px; }
      .form-title { margin: 0 0 24px; font-size: 16px; font-weight: 600; }
      .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 16px; }
      .field { display: block; min-width: 0; }
      .field-wide { grid-column: 1 / -1; }
      .field span { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 500; }
      .field input, .field textarea {
        width: 100%;
        min-height: 46px;
        padding: 11px 13px;
        border: 1px solid var(--concrete-gray);
        border-radius: 0;
        color: var(--obsidian);
        background: var(--paper-white);
      }
      .field textarea { min-height: 82px; resize: vertical; }
      .field input::placeholder, .field textarea::placeholder { color: var(--faint-gray); }
      .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 28px; }
      .feedback { margin: 14px 0 0; font-size: 13px; }

      .payment-methods { display: grid; gap: 12px; margin-top: 26px; }
      .payment-method { display: flex; align-items: center; gap: 13px; min-height: 68px; padding: 16px 20px; border: 1px solid var(--concrete-gray); cursor: pointer; }
      .payment-method:hover { background: #fafafa; }
      .payment-method:has(input:checked) { border-color: var(--obsidian); outline: 1px solid var(--obsidian); outline-offset: -1px; }
      .payment-method input, .payment-agreement input { width: 18px; height: 18px; margin: 0; flex: 0 0 auto; accent-color: var(--obsidian); }
      .payment-method span { font-size: 15px; font-weight: 500; }
      .payment-agreement { display: flex; align-items: flex-start; gap: 11px; margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--concrete-gray); cursor: pointer; }
      .payment-agreement span { font-size: 14px; }
      .payment-agreement strong { font-weight: 600; }

      .summary { position: sticky; top: 32px; border-top: 1px solid var(--obsidian); }
      .summary > h2 { padding: 18px 0 22px; border-bottom: 1px solid var(--concrete-gray); }
      .summary-row { display: flex; justify-content: space-between; gap: 16px; padding-top: 21px; font-size: 14px; }
      .summary-row span:first-child { color: var(--steel); }
      .summary-total { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-top: 25px; padding-top: 22px; border-top: 1px solid var(--obsidian); }
      .summary-total span { font-size: 15px; font-weight: 600; }
      .summary-total strong { font-size: 27px; font-weight: 600; letter-spacing: -0.035em; white-space: nowrap; }
      .payment-button {
        width: 100%;
        min-height: 52px;
        margin-top: 32px;
        padding: 0 24px;
        border: 1px solid var(--concrete-gray);
        border-radius: 30px;
        color: var(--faint-gray);
        background: var(--soft-mist);
        font-size: 16px;
        font-weight: 500;
        cursor: not-allowed;
      }
      .payment-button.is-active { border-color: var(--obsidian); color: var(--paper-white); background: var(--obsidian); cursor: pointer; }
      .payment-button.is-active:hover { opacity: 0.8; }
      .payment-button:disabled { cursor: not-allowed; }
      .payment-feedback { margin: 12px 0 0; padding: 14px 0 0; border-top: 1px solid var(--concrete-gray); color: var(--obsidian); font-size: 13px; line-height: 1.6; }

      @media (max-width: 1000px) {
        .checkout-grid { display: block; }
        .summary { position: static; margin-top: 64px; }
      }
      @media (max-width: 720px) {
        .topbar { height: 64px; }
        .topbar-inner, .page { width: min(100% - 40px, 100%); }
        .page { padding: 22px 0 80px; }
        .back-link { margin-bottom: 24px; }
        .checkout-grid { margin-top: 38px; }
        .section + .section { margin-top: 52px; }
        .summary { margin-top: 52px; }
      }
      @media (max-width: 420px) {
        .topbar-inner, .page { width: min(100% - 28px, 100%); }
        .login-button { min-width: 80px; min-height: 40px; padding: 0 18px; }
        .product { gap: 16px; padding: 20px 0; }
        .product-image-wrap { width: 108px; }
        .product-name { font-size: 17px; }
        .product-price { font-size: 14px; }
        .product-quantity { margin-top: 12px; }
        .form-grid { grid-template-columns: 1fr; }
        .field-wide { grid-column: auto; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="buyer-main.html" aria-label="JAPDA 홈">JAPDA</a>
        <button class="login-button" type="button">로그인</button>
      </div>
    </header>

    <main class="page">
      <a class="back-link" href="buyer-sale-product-detail.html" id="back-to-product">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none" aria-hidden="true"><path d="M10.5 3.5 5.5 8.5l5 5" stroke="currentColor" stroke-width="1.5" /></svg>
        상품 상세
      </a>
      <p class="eyebrow">주문 전 확인</p>
      <h1>체크아웃</h1>

      <div class="checkout-grid">
        <div>
          <section class="section" aria-labelledby="product-heading">
            <div class="section-heading"><h2 id="product-heading">상품 정보</h2></div>
            <div class="product">
              <div class="product-image-wrap">
                <img class="product-image" id="product-image" src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&amp;fit=crop&amp;w=800&amp;q=90" alt="JAPDA × ORBIT 레더 스니커즈" />
                <span class="product-image-fallback" id="product-image-fallback" hidden role="img" aria-label="JAPDA × ORBIT 레더 스니커즈 대표 이미지 없음">이미지 없음</span>
              </div>
              <div class="product-info">
                <p class="product-kicker">한정 판매</p>
                <h3 class="product-name">JAPDA × ORBIT<br />레더 스니커즈</h3>
                <p class="product-price">189,000원</p>
                <div class="product-quantity"><span>구매 수량</span><strong id="product-quantity">1개</strong></div>
              </div>
            </div>
          </section>

          <section class="section" aria-labelledby="shipping-heading">
            <div class="section-heading"><h2 id="shipping-heading">배송지</h2><button class="address-add-button" id="add-address" type="button" hidden>+ 배송지 추가</button></div>
            <ul class="address-list" id="address-list">
              <li>
                <label class="address-card">
                  <span class="address-card-head"><input type="radio" name="shipping-address" value="7" /><span class="address-name">집</span></span>
                  <span class="address-detail"><span class="recipient">홍길동 · 010-1234-5678</span><span>06236 · 서울특별시 강남구 테헤란로 123</span><span>101동 1001호</span><span class="message">문 앞에 놓아주세요</span></span>
                </label>
              </li>
              <li>
                <label class="address-card">
                  <span class="address-card-head"><input type="radio" name="shipping-address" value="8" /><span class="address-name">회사</span></span>
                  <span class="address-detail"><span class="recipient">홍길동 · 010-1234-5678</span><span>04524 · 서울특별시 중구 세종대로 110</span><span>8층</span></span>
                </label>
              </li>
            </ul>

            <div class="empty-address" id="empty-address" hidden>
              <p>등록된 배송지가 없습니다.</p>
              <button class="primary-button" id="open-registration" type="button">배송지 등록</button>
            </div>

            <form class="registration-form" id="registration-form" hidden>
              <h3 class="form-title">배송지 등록</h3>
              <div class="form-grid">
                <label class="field"><span>배송지명</span><input name="addressName" maxlength="100" placeholder="집" required /></label>
                <label class="field"><span>수취인명</span><input name="recipientName" maxlength="100" autocomplete="name" required /></label>
                <label class="field"><span>전화번호</span><input name="phoneNumber" type="tel" maxlength="30" autocomplete="tel" required /></label>
                <label class="field"><span>우편번호</span><input name="postalCode" maxlength="20" autocomplete="postal-code" required /></label>
                <label class="field field-wide"><span>기본 주소</span><input name="address" maxlength="255" autocomplete="street-address" required /></label>
                <label class="field field-wide"><span>상세 주소</span><input name="detailAddress" maxlength="255" autocomplete="address-line2" required /></label>
                <label class="field field-wide"><span>배송 메모</span><textarea name="deliveryMessage" maxlength="500" placeholder="문 앞에 놓아주세요"></textarea></label>
              </div>
              <div class="form-actions">
                <button class="secondary-button" id="cancel-registration" type="button">등록 취소</button>
                <button class="primary-button" type="submit">등록하기</button>
              </div>
            </form>
            <p class="feedback" id="registration-feedback" role="status" hidden></p>
          </section>

          <section class="section" aria-labelledby="payment-heading">
            <div class="section-heading"><h2 id="payment-heading">결제수단</h2></div>
            <!-- 실제 구현에서는 토스페이먼츠 SDK가 아래 영역에 결제수단과 약관 UI를 렌더링한다. -->
            <div class="payment-methods" id="payment-method" role="group" aria-label="결제수단 선택">
              <label class="payment-method"><input type="radio" name="payment-method" value="card" checked /><span>신용·체크카드</span></label>
              <label class="payment-method"><input type="radio" name="payment-method" value="easy-pay" /><span>간편결제</span></label>
              <label class="payment-method"><input type="radio" name="payment-method" value="transfer" /><span>계좌이체</span></label>
            </div>
            <div id="payment-agreement">
              <label class="payment-agreement"><input id="payment-agreement-checkbox" type="checkbox" /><span>결제 진행에 필요한 약관에 동의합니다. <strong>(필수)</strong></span></label>
            </div>
          </section>
        </div>

        <aside class="summary" aria-labelledby="summary-heading">
          <h2 id="summary-heading">금액 정보</h2>
          <div class="summary-row"><span>상품 금액</span><span id="line-total">189,000원</span></div>
          <div class="summary-row"><span>수량</span><span id="summary-quantity">1개</span></div>
          <div class="summary-total"><span>예상 총액</span><strong id="total-price">189,000원</strong></div>
          <button class="payment-button" id="payment-button" type="button" disabled>결제하기</button>
          <p class="payment-feedback" id="payment-feedback" role="status" aria-live="polite" tabindex="-1" hidden></p>
        </aside>
      </div>
    </main>

    <template id="address-template">
      <li><label class="address-card">
        <span class="address-card-head"><input type="radio" name="shipping-address" /><span class="address-name"></span></span>
        <span class="address-detail"><span class="recipient"></span><span class="address-line"></span><span class="detail-line"></span><span class="message" hidden></span></span>
      </label></li>
    </template>

    <script>
      // 목업의 금액 표시는 화면 이동 확인용이며 실제 화면은 체크아웃 API 응답을 사용한다.
      const params = new URLSearchParams(window.location.search)
      const quantity = Number(params.get('quantity'))
      const shownQuantity = Number.isSafeInteger(quantity) && quantity > 0 && quantity <= 2147483647 ? quantity : 1
      const quantityText = `${shownQuantity.toLocaleString('ko-KR')}개`
      const amountText = `${(189000 * shownQuantity).toLocaleString('ko-KR')}원`
      document.getElementById('product-quantity').textContent = quantityText
      document.getElementById('summary-quantity').textContent = quantityText
      document.getElementById('line-total').textContent = amountText
      document.getElementById('total-price').textContent = amountText

      const addressList = document.getElementById('address-list')
      const addAddressButton = document.getElementById('add-address')
      const emptyAddress = document.getElementById('empty-address')
      const registrationForm = document.getElementById('registration-form')
      const feedback = document.getElementById('registration-feedback')
      const paymentButton = document.getElementById('payment-button')
      const paymentFeedback = document.getElementById('payment-feedback')
      const paymentMethods = document.getElementById('payment-method')
      const paymentAgreement = document.getElementById('payment-agreement-checkbox')
      const paymentStates = new Set(['ready', 'loading', 'processing', 'success', 'fail', 'cancel', 'error'])
      let paymentState = paymentStates.has(params.get('payment')) ? params.get('payment') : 'ready'
      if (!params.has('payment') && params.get('empty') !== '1') {
        addressList.querySelector('input[name="shipping-address"]').checked = true
      }

      function showPaymentState(state) {
        if (!paymentStates.has(state)) return
        paymentState = state
        const url = new URL(window.location.href)
        url.searchParams.set('payment', state)
        if (window.location.protocol !== 'file:') window.history.replaceState(null, '', url)
        const selectedAddress = addressList.querySelector('input[name="shipping-address"]:checked')
        const selectedMethod = paymentMethods.querySelector('input[name="payment-method"]:checked')
        const busy = state === 'loading' || state === 'processing' || state === 'success'
        paymentButton.disabled = !selectedAddress || !selectedMethod || !paymentAgreement.checked || busy
        paymentButton.classList.toggle('is-active', !paymentButton.disabled)
        paymentButton.textContent = state === 'loading' ? '주문을 준비하는 중' : state === 'processing' ? '결제 인증을 진행하는 중' : '결제하기'
        const messages = {
          ready: !selectedAddress ? '배송지를 선택해 주세요.' : !selectedMethod ? '결제수단을 선택해 주세요.' : !paymentAgreement.checked ? '결제 약관에 동의해 주세요.' : '',
          loading: '주문을 준비하는 중입니다.',
          processing: '주문이 준비되었습니다. 결제 인증을 진행하는 중입니다.',
          success: '결제 인증은 완료됐지만 결제는 완료되지 않았습니다.',
          fail: '결제를 진행하지 못했습니다. 다시 시도해 주세요.',
          cancel: '결제를 취소했습니다.',
          error: '주문을 준비하지 못했습니다. 다시 시도해 주세요.',
        }
        paymentFeedback.textContent = messages[state]
        paymentFeedback.hidden = !messages[state]
        if (state === 'processing' || state === 'success' || state === 'fail' || state === 'cancel' || state === 'error') paymentFeedback.focus()
      }

      if (paymentState) {
        showPaymentState(paymentState)
        addressList.addEventListener('change', () => showPaymentState('ready'))
        paymentMethods.addEventListener('change', () => showPaymentState('ready'))
        paymentAgreement.addEventListener('change', () => showPaymentState('ready'))
        paymentButton.addEventListener('click', () => {
          if (paymentButton.disabled) return
          showPaymentState('loading')
          window.setTimeout(() => {
            if (paymentState === 'loading') showPaymentState('processing')
          }, 700)
        })
      }

      if (params.get('empty') === '1') {
        addressList.replaceChildren()
      }

      function showAddressView() {
        const addressCount = addressList.children.length
        const editing = !registrationForm.hidden
        addressList.hidden = editing || addressCount === 0
        emptyAddress.hidden = editing || addressCount > 0
        addAddressButton.hidden = editing || addressCount === 0 || addressCount >= 10
      }

      function openAddressRegistration() {
        registrationForm.hidden = false
        feedback.hidden = true
        showAddressView()
        registrationForm.elements.addressName.focus()
      }

      showAddressView()
      document.getElementById('open-registration').addEventListener('click', openAddressRegistration)
      addAddressButton.addEventListener('click', openAddressRegistration)

      document.getElementById('cancel-registration').addEventListener('click', () => {
        registrationForm.hidden = true
        registrationForm.reset()
        showAddressView()
      })

      registrationForm.addEventListener('input', (event) => event.target.setCustomValidity(''))
      registrationForm.addEventListener('submit', (event) => {
        event.preventDefault()
        for (const input of registrationForm.querySelectorAll('[required]')) {
          if (!input.value.trim()) {
            input.setCustomValidity('필수 항목입니다.')
            input.reportValidity()
            return
          }
        }

        const data = new FormData(registrationForm)
        const item = document.getElementById('address-template').content.firstElementChild.cloneNode(true)
        const value = (name) => String(data.get(name) ?? '').trim()
        item.querySelector('input').value = '9'
        item.querySelector('.address-name').textContent = value('addressName')
        item.querySelector('.recipient').textContent = `${value('recipientName')} · ${value('phoneNumber')}`
        item.querySelector('.address-line').textContent = `${value('postalCode')} · ${value('address')}`
        item.querySelector('.detail-line').textContent = value('detailAddress')
        const message = value('deliveryMessage')
        if (message) {
          item.querySelector('.message').hidden = false
          item.querySelector('.message').textContent = message
        }
        addressList.append(item)
        item.querySelector('input').checked = true
        registrationForm.hidden = true
        registrationForm.reset()
        showAddressView()
        feedback.textContent = '배송지가 등록되었습니다.'
        feedback.hidden = false
        showPaymentState('ready')
      })

      document.getElementById('product-image').addEventListener('error', (event) => {
        event.target.hidden = true
        document.getElementById('product-image-fallback').hidden = false
      })
      if (document.getElementById('product-image').complete && document.getElementById('product-image').naturalWidth === 0) {
        document.getElementById('product-image').hidden = true
        document.getElementById('product-image-fallback').hidden = false
      }
    </script>
  </body>
</html>
