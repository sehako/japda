<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders · JAPDA</title>
    <style>
      :root {
        --obsidian: #111111;
        --paper-white: #ffffff;
        --concrete-gray: #e5e5e5;
        --soft-mist: #f6f6f4;
        --steel: #707072;
        --faint-gray: #9e9ea0;
        --font: Pretendard, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      html { color-scheme: light; }
      body {
        min-width: 320px;
        margin: 0;
        color: var(--obsidian);
        background: var(--paper-white);
        font: 14px/1.6 var(--font);
        -webkit-font-smoothing: antialiased;
      }
      button { color: inherit; font: inherit; }
      button, a { -webkit-tap-highlight-color: transparent; }
      a { color: inherit; text-decoration: none; }
      a:focus-visible, button:focus-visible { outline: 2px solid var(--obsidian); outline-offset: 4px; }
      [hidden] { display: none !important; }

      .topbar {
        height: 72px;
        border-bottom: 1px solid var(--concrete-gray);
        background: rgba(255, 255, 255, 0.96);
      }
      .topbar-inner {
        width: min(100% - 64px, 1440px);
        height: 100%;
        margin: auto;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
      }
      .brand { width: fit-content; font-size: 20px; font-weight: 650; letter-spacing: -0.045em; }
      .global-nav { display: flex; align-items: center; gap: 34px; }
      .global-nav a {
        position: relative;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        color: var(--steel);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      .global-nav a:hover, .global-nav a[aria-current="page"] { color: var(--obsidian); }
      .global-nav a[aria-current="page"]::after {
        position: absolute;
        right: 0;
        bottom: -14px;
        left: 0;
        height: 1px;
        background: var(--obsidian);
        content: "";
      }
      .account {
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
      }
      .account-mark {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border: 1px solid var(--obsidian);
        border-radius: 50%;
        font-size: 10px;
        font-weight: 700;
      }
      .account-email { max-width: 220px; overflow: hidden; font-size: 12px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }

      .page { width: min(100% - 64px, 1200px); margin: auto; padding: 88px 0 128px; }
      .page-heading {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 32px;
        padding-bottom: 36px;
      }
      .eyebrow { margin: 0 0 12px; font-size: 11px; font-weight: 650; letter-spacing: 0.18em; }
      h1 { margin: 0; font-size: clamp(48px, 7vw, 88px); font-weight: 560; line-height: 0.92; letter-spacing: -0.065em; }
      .description { margin: 0 0 4px; color: var(--steel); font-size: 15px; word-break: keep-all; }

      .order-section { border-top: 1px solid var(--obsidian); }
      .list-meta {
        min-height: 58px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        border-bottom: 1px solid var(--concrete-gray);
        color: var(--steel);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      .list-meta strong { color: var(--obsidian); font-weight: 650; }
      .order-list { margin: 0; padding: 0; list-style: none; }
      .order-row {
        display: grid;
        grid-template-columns: 170px minmax(0, 1fr) 210px;
        gap: 40px;
        padding: 32px 0 34px;
        border-bottom: 1px solid var(--concrete-gray);
      }
      .order-date { margin: 0; font-size: 13px; font-weight: 600; }
      .order-number { margin: 4px 0 0; color: var(--steel); font-size: 11px; letter-spacing: 0.02em; }
      .order-main { min-width: 0; }
      .order-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
      .product-name { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.45; letter-spacing: -0.025em; word-break: keep-all; }
      .status {
        min-height: 27px;
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        padding: 0 11px;
        border: 1px solid var(--concrete-gray);
        border-radius: 999px;
        color: var(--steel);
        background: var(--paper-white);
        font-size: 11px;
        font-weight: 650;
        white-space: nowrap;
      }
      .status-paid { border-color: var(--obsidian); color: var(--paper-white); background: var(--obsidian); }
      .order-detail { margin: 8px 0 0; color: var(--steel); font-size: 13px; }
      .order-expiry { margin: 16px 0 0; color: var(--steel); font-size: 12px; }
      .order-expiry strong { color: var(--obsidian); font-weight: 600; }
      .order-price { align-self: center; text-align: right; }
      .price-label { display: block; margin-bottom: 2px; color: var(--steel); font-size: 11px; }
      .price-value { font-size: 22px; font-weight: 600; letter-spacing: -0.03em; white-space: nowrap; }

      .pagination { display: flex; justify-content: center; padding-top: 44px; }
      .load-more, .primary-link, .primary-button {
        min-width: 170px;
        min-height: 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        border: 1px solid var(--obsidian);
        border-radius: 999px;
        color: var(--paper-white);
        background: var(--obsidian);
        font-weight: 550;
        cursor: pointer;
      }
      .load-more:hover:not(:disabled), .primary-link:hover, .primary-button:hover { opacity: 0.78; }
      .load-more:disabled { cursor: wait; opacity: 0.48; }
      .feedback { margin: 16px 0 0; color: var(--steel); font-size: 12px; text-align: center; }

      .state-view {
        min-height: 440px;
        display: grid;
        place-items: center;
        border-top: 1px solid var(--obsidian);
        border-bottom: 1px solid var(--concrete-gray);
        text-align: center;
      }
      .state-inner { width: min(100% - 32px, 470px); padding: 80px 0; }
      .state-kicker { margin: 0 0 12px; color: var(--steel); font-size: 11px; font-weight: 650; letter-spacing: 0.16em; }
      .state-view h2 { margin: 0; font-size: 25px; font-weight: 600; line-height: 1.35; letter-spacing: -0.035em; word-break: keep-all; }
      .state-message { margin: 14px 0 0; color: var(--steel); font-size: 14px; word-break: keep-all; }
      .state-action { margin-top: 28px; }
      .loading-lines { display: grid; gap: 9px; width: 168px; margin: 28px auto 0; }
      .loading-lines span { height: 3px; background: var(--obsidian); animation: pulse 1.1s ease-in-out infinite alternate; }
      .loading-lines span:nth-child(2) { width: 72%; animation-delay: 180ms; }
      .loading-lines span:nth-child(3) { width: 42%; animation-delay: 360ms; }
      @keyframes pulse { from { opacity: 0.12; } to { opacity: 0.8; } }

      .footer { border-top: 1px solid var(--concrete-gray); }
      .footer-inner {
        width: min(100% - 64px, 1440px);
        min-height: 116px;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        color: var(--steel);
        font-size: 11px;
      }
      .footer-brand { color: var(--obsidian); font-size: 14px; font-weight: 650; letter-spacing: -0.03em; }

      @media (max-width: 820px) {
        .page { padding-top: 64px; }
        .page-heading { display: block; }
        .description { margin-top: 24px; }
        .order-row { grid-template-columns: 120px minmax(0, 1fr); gap: 28px; }
        .order-price { grid-column: 2; text-align: left; }
        .price-label { display: inline; margin-right: 10px; }
        .price-value { font-size: 18px; }
      }
      @media (max-width: 600px) {
        .topbar { height: 64px; }
        .topbar-inner, .page, .footer-inner { width: min(100% - 40px, 100%); }
        .account-email { display: none; }
        .global-nav { gap: 20px; }
        .page { padding: 48px 0 88px; }
        .page-heading { padding-bottom: 30px; }
        h1 { font-size: 52px; }
        .description { max-width: 280px; font-size: 14px; }
        .list-meta { min-height: 50px; }
        .order-row { display: block; padding: 26px 0 28px; }
        .order-header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
        .order-number { margin: 0; }
        .order-main { margin-top: 18px; }
        .order-title-row { gap: 12px; }
        .product-name { font-size: 17px; }
        .order-price { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--soft-mist); }
        .pagination { padding-top: 36px; }
        .footer-inner { min-height: 100px; }
        .footer-inner span:last-child { display: none; }
      }
      @media (max-width: 380px) {
        .topbar-inner, .page, .footer-inner { width: min(100% - 28px, 100%); }
        .global-nav { gap: 14px; }
        h1 { font-size: 46px; }
        .order-title-row { display: block; }
        .status { margin-top: 12px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-lines span { animation: none; opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="buyer-main.html" aria-label="JAPDA 홈">JAPDA</a>
        <nav class="global-nav" aria-label="주요 메뉴">
          <a href="buyer-main.html">SHOP</a>
          <a href="buyer-order-history.html" aria-current="page">ORDERS</a>
        </nav>
        <div class="account" aria-label="로그인 사용자">
          <span class="account-email">hello@japda.kr</span>
          <span class="account-mark" aria-hidden="true">HJ</span>
        </div>
      </div>
    </header>

    <main class="page">
      <header class="page-heading">
        <div>
          <p class="eyebrow">PURCHASE HISTORY</p>
          <h1>Orders</h1>
        </div>
        <p class="description">구매한 상품과 주문 상태를 확인할 수 있습니다.</p>
      </header>

      <section class="order-section" id="order-section" aria-labelledby="order-list-heading">
        <div class="list-meta">
          <strong id="order-list-heading">주문 내역</strong>
          <span>최신 주문순</span>
        </div>
        <ol class="order-list" id="order-list"></ol>
        <div class="pagination">
          <button class="load-more" id="load-more" type="button">주문 더 불러오기</button>
        </div>
        <p class="feedback" id="load-feedback" role="status" aria-live="polite"></p>
      </section>

      <section class="state-view" id="state-view" data-state-view hidden aria-labelledby="state-title">
        <div class="state-inner">
          <p class="state-kicker" id="state-kicker"></p>
          <h2 id="state-title"></h2>
          <p class="state-message" id="state-message"></p>
          <div class="loading-lines" id="loading-lines" hidden aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="state-action" id="state-action" hidden></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-inner"><span class="footer-brand">JAPDA</span><span>© 2026 JAPDA. ALL RIGHTS RESERVED.</span></div>
    </footer>

    <template id="order-template">
      <li class="order-row" data-order-row>
        <div class="order-header">
          <p class="order-date"></p>
          <p class="order-number"></p>
        </div>
        <div class="order-main">
          <div class="order-title-row"><h2 class="product-name"></h2><span class="status"></span></div>
          <p class="order-detail"></p>
          <p class="order-expiry" hidden></p>
        </div>
        <div class="order-price"><span class="price-label">주문 금액</span><strong class="price-value"></strong></div>
      </li>
    </template>

    <script>
      const initialOrders = [
        { id: 1284, date: '2026. 09. 14. 14:32', datetime: '2026-09-14T14:32:00+09:00', product: 'JAPDA × ORBIT 레더 스니커즈', quantity: 1, unitPrice: 189000, totalPrice: 189000, status: 'PAID' },
        { id: 1281, date: '2026. 09. 13. 20:18', datetime: '2026-09-13T20:18:00+09:00', product: '오브제 스틸 테이블 램프', quantity: 1, unitPrice: 129000, totalPrice: 129000, status: 'PENDING_PAYMENT', expires: '2026. 09. 13. 20:21' },
        { id: 1273, date: '2026. 09. 08. 11:06', datetime: '2026-09-08T11:06:00+09:00', product: '시그니처 울 블렌드 재킷', quantity: 2, unitPrice: 248000, totalPrice: 496000, status: 'PAID' },
      ]
      const nextOrders = [
        { id: 1256, date: '2026. 08. 27. 16:42', datetime: '2026-08-27T16:42:00+09:00', product: '아카이브 레더 카드 홀더', quantity: 1, unitPrice: 78000, totalPrice: 78000, status: 'PAID' },
        { id: 1242, date: '2026. 08. 12. 09:15', datetime: '2026-08-12T09:15:00+09:00', product: '리넨 워크 셔츠 · 크림', quantity: 1, unitPrice: 118000, totalPrice: 118000, status: 'PAID' },
      ]

      const orderSection = document.getElementById('order-section')
      const orderList = document.getElementById('order-list')
      const loadMore = document.getElementById('load-more')
      const loadFeedback = document.getElementById('load-feedback')
      const stateView = document.getElementById('state-view')
      const stateAction = document.getElementById('state-action')

      const formatWon = (amount) => `${amount.toLocaleString('ko-KR')}원`

      function createOrderRow(order) {
        const row = document.getElementById('order-template').content.firstElementChild.cloneNode(true)
        const date = document.createElement('time')
        date.dateTime = order.datetime
        date.textContent = order.date
        row.querySelector('.order-date').append(date)
        row.querySelector('.order-number').textContent = `주문 번호 #${order.id}`
        row.querySelector('.product-name').textContent = order.product
        row.querySelector('.order-detail').textContent = `수량 ${order.quantity.toLocaleString('ko-KR')}개 × ${formatWon(order.unitPrice)}`
        row.querySelector('.price-value').textContent = formatWon(order.totalPrice)

        const status = row.querySelector('.status')
        status.textContent = order.status === 'PAID' ? '결제 완료' : '결제 대기'
        status.classList.toggle('status-paid', order.status === 'PAID')

        if (order.status === 'PENDING_PAYMENT' && order.expires) {
          const expiry = row.querySelector('.order-expiry')
          expiry.innerHTML = `결제 기한 <strong>${order.expires}</strong>`
          expiry.hidden = false
        }
        return row
      }

      function appendOrders(orders) {
        const fragment = document.createDocumentFragment()
        orders.forEach((order) => fragment.append(createOrderRow(order)))
        orderList.append(fragment)
      }

      function showList() {
        stateView.hidden = true
        orderSection.hidden = false
        orderList.replaceChildren()
        appendOrders(initialOrders)
        loadMore.hidden = false
        loadMore.disabled = false
        loadMore.textContent = '주문 더 불러오기'
        loadFeedback.textContent = ''
      }

      const stateContent = {
        loading: { kicker: 'ORDERS', title: '주문 내역을 확인하고 있습니다.', message: '잠시만 기다려 주세요.', loading: true, role: 'status' },
        empty: { kicker: 'ORDERS', title: '아직 구매 내역이 없습니다.', message: '지금 판매 중인 상품을 둘러보세요.', action: '상품 둘러보기', href: 'buyer-main.html', role: 'status' },
        error: { kicker: 'ERROR', title: '주문 내역을 불러오지 못했습니다.', message: '잠시 후 다시 시도해 주세요.', action: '다시 시도', retry: true, role: 'alert' },
        unauthenticated: { kicker: 'SIGN IN', title: '로그인이 필요합니다.', message: '주문 내역은 로그인 후 확인할 수 있습니다.', action: '로그인', href: '/oauth2/authorization/google', role: 'alert' },
        'buyer-link': { kicker: 'ACCOUNT', title: '구매자 정보 연결이 필요합니다.', message: '현재 계정으로 주문 내역을 확인할 수 없습니다.', action: '홈으로 돌아가기', href: 'buyer-main.html', role: 'alert' },
      }

      function showState(key) {
        const state = stateContent[key]
        if (!state) { showList(); return }
        orderSection.hidden = true
        stateView.hidden = false
        stateView.setAttribute('role', state.role)
        if (state.role === 'status') stateView.setAttribute('aria-live', 'polite')
        else stateView.removeAttribute('aria-live')
        document.getElementById('state-kicker').textContent = state.kicker
        document.getElementById('state-title').textContent = state.title
        document.getElementById('state-message').textContent = state.message
        document.getElementById('loading-lines').hidden = !state.loading
        stateAction.replaceChildren()
        stateAction.hidden = !state.action
        if (state.action) {
          const control = document.createElement(state.retry ? 'button' : 'a')
          control.className = state.retry ? 'primary-button' : 'primary-link'
          control.textContent = state.action
          if (state.retry) {
            control.type = 'button'
            control.addEventListener('click', showList)
          } else {
            control.href = state.href
          }
          stateAction.append(control)
        }
      }

      loadMore.addEventListener('click', () => {
        if (loadMore.disabled) return
        loadMore.disabled = true
        loadMore.textContent = '불러오는 중'
        loadFeedback.textContent = ''
        window.setTimeout(() => {
          appendOrders(nextOrders)
          loadMore.hidden = true
          loadMore.disabled = false
          loadMore.textContent = '주문 더 불러오기'
          loadFeedback.textContent = '주문 2건을 더 불러왔습니다.'
        }, 420)
      })

      const requestedState = new URLSearchParams(window.location.search).get('state')
      if (requestedState && Object.hasOwn(stateContent, requestedState)) showState(requestedState)
      else showList()
    </script>
  </body>
</html>
