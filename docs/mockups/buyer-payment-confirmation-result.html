<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JAPDA 결제 결과 목업</title>
    <style>
      :root {
        --obsidian: #111111;
        --paper-white: #ffffff;
        --concrete-gray: #e5e5e5;
        --steel: #707072;
        --signal: #d92d20;
        --font: Pretendard, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      html { color-scheme: light; }
      body {
        min-width: 320px;
        margin: 0;
        color: var(--obsidian);
        background: var(--paper-white);
        font: 14px/1.6 var(--font);
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; text-decoration: none; }
      a:focus-visible { outline: 2px solid var(--obsidian); outline-offset: 4px; }
      [hidden] { display: none !important; }

      .topbar { height: 72px; border-bottom: 1px solid var(--concrete-gray); }
      .topbar-inner {
        width: min(100% - 64px, 1440px);
        height: 100%;
        margin: auto;
        display: flex;
        align-items: center;
      }
      .brand { font-size: 20px; font-weight: 600; letter-spacing: -0.04em; }

      .page { width: min(100% - 64px, 1200px); margin: auto; padding: 80px 0 120px; }
      .result {
        min-height: 440px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-top: 1px solid var(--concrete-gray);
        border-bottom: 1px solid var(--concrete-gray);
        text-align: center;
      }
      .result-inner { width: min(100% - 40px, 480px); padding: 64px 0; }
      .eyebrow { margin: 0 0 14px; color: var(--steel); font-size: 11px; font-weight: 600; letter-spacing: 0.16em; }
      .eyebrow.signal { color: var(--signal); }
      h1 { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.35; letter-spacing: -0.035em; word-break: keep-all; }
      .message { margin: 16px 0 0; font-size: 16px; line-height: 1.6; word-break: keep-all; }
      .detail { margin: 10px 0 0; color: var(--steel); font-size: 14px; line-height: 1.6; word-break: keep-all; }
      .progress-mark { display: flex; justify-content: center; gap: 7px; margin: 28px 0 0; }
      .progress-mark span { width: 6px; height: 6px; border-radius: 50%; background: var(--obsidian); }
      .progress-mark span:nth-child(2) { opacity: 0.55; }
      .progress-mark span:nth-child(3) { opacity: 0.25; }
      .receipt { margin: 32px 0 0; border-top: 1px solid var(--obsidian); text-align: left; }
      .receipt-row { display: flex; justify-content: space-between; gap: 24px; padding: 15px 0; border-bottom: 1px solid var(--concrete-gray); }
      .receipt-row dt { flex: 0 0 auto; color: var(--steel); }
      .receipt-row dd { min-width: 0; margin: 0; font-weight: 500; text-align: right; overflow-wrap: anywhere; }
      .receipt-row.amount dd { font-size: 20px; font-weight: 600; letter-spacing: -0.025em; }
      .actions { margin-top: 32px; }
      .pill-link {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        border-radius: 30px;
        color: var(--paper-white);
        background: var(--obsidian);
        font-weight: 500;
      }
      .pill-link:hover { opacity: 0.8; }
      .quiet-link { display: inline-flex; min-height: 42px; align-items: center; color: var(--steel); text-decoration: underline; text-underline-offset: 3px; }
      .quiet-link:hover { color: var(--obsidian); }

      .mockup-nav { width: min(100% - 64px, 1200px); margin: 0 auto 80px; padding-top: 20px; color: var(--steel); font-size: 12px; }
      .mockup-nav p { margin: 0 0 12px; }
      .mockup-nav .group-label { margin-top: 18px; color: var(--obsidian); font-weight: 600; }
      .mockup-links { display: flex; flex-wrap: wrap; gap: 8px 18px; }
      .mockup-links a { text-decoration: underline; text-underline-offset: 3px; }
      .mockup-links a[aria-current="page"] { color: var(--obsidian); font-weight: 600; }

      @media (max-width: 720px) {
        .topbar { height: 64px; }
        .topbar-inner, .page, .mockup-nav { width: min(100% - 40px, 100%); }
        .page { padding: 48px 0 80px; }
        .result { min-height: 400px; }
        .result-inner { width: min(100% - 24px, 480px); padding: 56px 0; }
        .mockup-nav { margin-bottom: 48px; }
      }
      @media (max-width: 420px) {
        .topbar-inner, .page, .mockup-nav { width: min(100% - 28px, 100%); }
        .result-inner { width: min(100% - 16px, 480px); }
        h1 { font-size: 22px; }
        .message { font-size: 15px; }
        .receipt-row { gap: 12px; }
      }
    </style>
  </head>
  <body>
    <header class="topbar"><div class="topbar-inner"><a class="brand" href="buyer-main.html" aria-label="JAPDA 홈">JAPDA</a></div></header>

    <main class="page">
      <section class="result" id="result" aria-labelledby="result-title">
        <div class="result-inner">
          <p class="eyebrow" id="eyebrow">결제 결과</p>
          <h1 id="result-title"></h1>
          <p class="message" id="message"></p>
          <p class="detail" id="detail" hidden></p>
          <div class="progress-mark" id="progress" aria-hidden="true" hidden><span></span><span></span><span></span></div>
          <dl class="receipt" id="receipt" hidden>
            <div class="receipt-row"><dt>주문 번호</dt><dd>1284</dd></div>
            <div class="receipt-row amount"><dt>확정 금액</dt><dd>70,000원</dd></div>
            <div class="receipt-row"><dt>승인 시각</dt><dd>2026. 09. 14. 14:32</dd></div>
          </dl>
          <div class="actions" id="actions" hidden><a id="action-link" href="buyer-main.html"></a></div>
        </div>
      </section>
    </main>

    <nav class="mockup-nav" aria-label="목업 상태 선택">
      <p>목업 상태 미리보기 · 아래 링크는 실제 결제 화면에 포함되지 않습니다.</p>
      <p class="group-label">대표 화면</p>
      <div class="mockup-links" id="mockup-links">
        <a href="?state=confirming">최초 확인</a>
        <a href="?state=processing">승인 중</a>
        <a href="?state=paid">결제 완료</a>
        <a href="?state=failed">확정 실패</a>
        <a href="?state=review">결과 확인 필요</a>
        <a href="?state=invalid">진행할 수 없는 오류</a>
      </div>
      <p class="group-label">문구·링크 변형</p>
      <div class="mockup-links">
        <a href="?state=failed&amp;reason=expired">주문 만료</a>
        <a href="?state=failed&amp;return=invalid">복귀 정보 없는 실패</a>
        <a href="?state=review&amp;reason=unavailable">승인 요청 오류</a>
        <a href="?state=review&amp;reason=manual">별도 확인 필요</a>
        <a href="?state=invalid&amp;reason=rejected">요청 거절</a>
      </div>
    </nav>

    <script>
      // 목업의 상태 전환과 예시 주문 정보는 실제 승인 API를 호출하지 않는다.
      const states = {
        confirming: { title: '결제 결과를 확인하고 있습니다.', message: '결제 승인 결과를 확인하는 중입니다.', progress: true, role: 'status' },
        processing: { title: '결제 승인 처리 중입니다.', message: '결제 결과를 자동으로 확인하고 있습니다.', detail: '결제 상태가 확정될 때까지 잠시만 기다려 주세요.', progress: true, role: 'status' },
        paid: { title: '결제가 완료됐습니다.', message: '주문이 정상적으로 확정됐습니다.', receipt: true, action: '상품 목록으로 돌아가기', role: 'status' },
        failed: { title: '결제에 실패했습니다.', message: '결제가 완료되지 않았습니다.', detail: '결제 화면으로 돌아가 다시 결제할 수 있습니다.', signal: true, action: '결제 화면으로 돌아가기', role: 'alert' },
        review: { title: '결제 결과를 아직 확인할 수 없습니다.', message: '결제가 완료됐을 수 있으니 잠시만 기다려 주세요.', detail: '결제 결과 확인 시간이 초과됐습니다.', action: '상품 목록으로 돌아가기', quiet: true, role: 'alert' },
        invalid: { title: '결제 정보를 확인할 수 없습니다.', message: '요청 정보가 올바르지 않거나 필요한 설정이 없어 승인을 진행할 수 없습니다.', action: '상품 목록으로 돌아가기', role: 'alert' },
      }

      const params = new URLSearchParams(location.search)
      const stateKey = Object.hasOwn(states, params.get('state')) ? params.get('state') : 'paid'
      const state = { ...states[stateKey] }
      if (stateKey === 'failed' && params.get('reason') === 'expired') {
        state.title = '주문이 만료됐습니다.'
        state.message = '이 주문으로는 결제를 진행할 수 없습니다.'
        state.detail = '결제 화면으로 돌아가 새 주문으로 다시 시도해 주세요.'
      }
      if (stateKey === 'review' && params.get('reason') === 'unavailable') state.detail = '승인 요청 중 오류가 발생했습니다.'
      if (stateKey === 'review' && params.get('reason') === 'manual') state.detail = '결제 상태에 별도 확인이 필요합니다.'
      if (stateKey === 'invalid' && params.get('reason') === 'rejected') state.message = '현재 결제 정보로는 승인을 진행할 수 없습니다.'
      const result = document.getElementById('result')
      const detail = document.getElementById('detail')
      const actions = document.getElementById('actions')
      const actionLink = document.getElementById('action-link')

      result.setAttribute('role', state.role)
      if (state.role === 'status') result.setAttribute('aria-live', 'polite')
      document.getElementById('result-title').textContent = state.title
      document.getElementById('message').textContent = state.message
      document.getElementById('eyebrow').classList.toggle('signal', Boolean(state.signal))
      document.getElementById('progress').hidden = !state.progress
      document.getElementById('receipt').hidden = !state.receipt
      if (state.detail) { detail.textContent = state.detail; detail.hidden = false }
      if (state.action) {
        actions.hidden = false
        const canReturnToCheckout = state.action === '결제 화면으로 돌아가기' && params.get('return') !== 'invalid'
        actionLink.textContent = canReturnToCheckout ? state.action : '상품 목록으로 돌아가기'
        actionLink.href = canReturnToCheckout ? 'buyer-checkout.html' : 'buyer-main.html'
        actionLink.className = state.quiet ? 'quiet-link' : 'pill-link'
      }
      document.querySelectorAll('.mockup-links a').forEach((link) => {
        if (new URL(link.href).search === location.search || (location.search === '' && new URL(link.href).searchParams.get('state') === stateKey)) link.setAttribute('aria-current', 'page')
      })
    </script>
  </body>
</html>
