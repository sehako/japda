spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/japda}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 51MB

product:
  image:
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION}

sale:
  daily-capacity: ${SALE_DAILY_CAPACITY:20}

payment:
  reconcile-interval: ${PAYMENT_RECONCILE_INTERVAL:PT30S}
  toss:
    base-url: ${TOSS_API_BASE_URL:https://api.tosspayments.com}
    secret-key: ${TOSS_SECRET_KEY:}
    connect-timeout: ${TOSS_CONNECT_TIMEOUT:PT3S}
    response-timeout: ${TOSS_RESPONSE_TIMEOUT:PT10S}

cors:
  allowed-origins:
    - http://localhost:5173
