spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/japda}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 51MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

product:
  image:
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION}

sale:
  daily-capacity: ${SALE_DAILY_CAPACITY:20}

payment:
  reconcile-interval: ${PAYMENT_RECONCILE_INTERVAL:PT30S}
  toss:
    client-mode: ${TOSS_CLIENT_MODE:fake}
    fake-response-delay: ${TOSS_FAKE_RESPONSE_DELAY:PT0.2S}
    base-url: ${TOSS_API_BASE_URL:https://api.tosspayments.com}
    secret-key: ${TOSS_SECRET_KEY:}
    connect-timeout: ${TOSS_CONNECT_TIMEOUT:PT3S}
    response-timeout: ${TOSS_RESPONSE_TIMEOUT:PT10S}

order:
  inventory:
    redis:
      enabled: ${ORDER_INVENTORY_REDIS_ENABLED:false}
      namespace: ${ORDER_INVENTORY_REDIS_NAMESPACE:japda}
      host: ${ORDER_INVENTORY_REDIS_HOST:localhost}
      port: ${ORDER_INVENTORY_REDIS_PORT:6379}
      connect-timeout: ${ORDER_INVENTORY_REDIS_CONNECT_TIMEOUT:PT0.5S}
      command-timeout: ${ORDER_INVENTORY_REDIS_COMMAND_TIMEOUT:PT0.2S}
      stock-ttl: ${ORDER_INVENTORY_REDIS_STOCK_TTL:PT30S}
      lock-ttl: ${ORDER_INVENTORY_REDIS_LOCK_TTL:PT3S}
      polling-timeout: ${ORDER_INVENTORY_REDIS_POLLING_TIMEOUT:PT0.5S}
      polling-interval: ${ORDER_INVENTORY_REDIS_POLLING_INTERVAL:PT0.025S}

cors:
  allowed-origins:
    - http://localhost:5173

auth:
  jwt-signing-key: ${AUTH_JWT_SIGNING_KEY:}
  issuer: ${AUTH_JWT_ISSUER:http://localhost:8080}
  audience: ${AUTH_JWT_AUDIENCE:japda-spa}
  success-url: ${AUTH_SUCCESS_URL:http://localhost:5173/auth/success}
  failure-url: ${AUTH_FAILURE_URL:http://localhost:5173/auth/failure}
  cookie-secure: ${AUTH_COOKIE_SECURE:false}
  admin-emails: ${AUTH_ADMIN_EMAILS:}

management:
  endpoints:
    web:
      exposure:
        exclude: "*"
